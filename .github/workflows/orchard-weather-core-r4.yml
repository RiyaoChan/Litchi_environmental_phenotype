name: Exact orchard core weather R4

on:
  push:
    branches:
      - codex/litchi-orchard-weather-r4
    paths:
      - '.github/workflows/orchard-weather-core-r4.yml'
      - 'configs/orchard_weather_core.yaml'
      - 'scripts/download_era5_gapfill.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-validate-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/litchi-orchard-weather-r4
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pandas requests pyyaml

      - name: Download exact-orchard core daily ERA5 data
        run: python scripts/download_era5_gapfill.py --config configs/orchard_weather_core.yaml

      - name: Verify exact-orchard core package
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root = Path('data/external/open_meteo_era5_exact_core')
          data = pd.read_csv(root / 'weather_daily_era5_exact_core.csv')
          meta = json.loads((root / 'download_metadata.json').read_text(encoding='utf-8'))
          assert len(data) == 5385, len(data)
          assert set(data.station_id) == {'bannei', 'hongming', 'luhong'}
          assert data.groupby('station_id').date.nunique().eq(1795).all()
          assert not data[['tmean_c','tmin_c','tmax_c','precip_mm','relative_humidity_pct','sunshine_h','shortwave_radiation_mj_m2','wind_speed_mean_ms','wind_speed_max_ms','et0_mm']].isna().any().any()
          assert meta['total_rows'] == 5385
          print(data.groupby('station_id').date.agg(['min','max','count']))
          print(data[['station_id','requested_latitude','requested_longitude','grid_latitude','grid_longitude','elevation_m']].drop_duplicates())
          PY

      - name: Persist exact-orchard core package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/external/open_meteo_era5_exact_core/
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Add exact-orchard core ERA5 daily weather data'
            git push origin HEAD:codex/litchi-orchard-weather-r4
          fi

      - name: Upload exact-orchard core package
        uses: actions/upload-artifact@v4
        with:
          name: exact-orchard-core-weather-r4
          if-no-files-found: error
          retention-days: 30
          path: data/external/open_meteo_era5_exact_core/
